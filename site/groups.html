<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lens Groups</title>
<script>try { const t = localStorage.getItem("lenstheme"); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: one centered column; a soft pastel wash behind the header; cards on a white page with dashed rules between sections. */
:root{
  color-scheme:light;
  --page:#ffffff; --surface:#ffffff; --card:rgba(44,45,48,.02);
  --ink:#2c2d30; --ink2:rgba(44,45,48,.6); --muted:rgba(44,45,48,.42);
  --grid:#ececec; --axis:#dedede; --border:rgba(44,45,48,.07); --ring:0 0 0 1px rgba(44,45,48,.07);
  --up:#12a150; --down:#e5484d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --other:#b5b5b0; --accent:#1ec6a2; --accent-ink:#ffffff; --wash:rgba(30,198,162,.12);
  --glow1:rgba(30,198,162,.16); --glow2:rgba(255,145,190,.14); --glow3:rgba(147,145,247,.14);
  --font-display:"Figtree","Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#151619; --surface:#1b1c1f; --card:rgba(255,255,255,.025);
    --ink:#f1f1f2; --ink2:rgba(241,241,242,.62); --muted:rgba(241,241,242,.42);
    --grid:#2a2b2f; --axis:#34353a; --border:rgba(255,255,255,.08); --ring:0 0 0 1px rgba(255,255,255,.08);
    --up:#2fc76a; --down:#ff6b6f;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --other:#5f6066; --accent:#2fd3ae; --accent-ink:#0f1a17; --wash:rgba(47,211,174,.16);
    --glow1:rgba(47,211,174,.10); --glow2:rgba(255,145,190,.07); --glow3:rgba(147,145,247,.09);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#151619; --surface:#1b1c1f; --card:rgba(255,255,255,.025);
  --ink:#f1f1f2; --ink2:rgba(241,241,242,.62); --muted:rgba(241,241,242,.42);
  --grid:#2a2b2f; --axis:#34353a; --border:rgba(255,255,255,.08); --ring:0 0 0 1px rgba(255,255,255,.08);
  --up:#2fc76a; --down:#ff6b6f;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --other:#5f6066; --accent:#2fd3ae; --accent-ink:#0f1a17; --wash:rgba(47,211,174,.16);
  --glow1:rgba(47,211,174,.10); --glow2:rgba(255,145,190,.07); --glow3:rgba(147,145,247,.09);
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 var(--font-body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body::before{content:"";position:absolute;inset:0 0 auto;height:420px;z-index:0;pointer-events:none;
  background:radial-gradient(40% 70% at 12% 10%,var(--glow1),transparent 70%),radial-gradient(35% 60% at 55% 0%,var(--glow2),transparent 70%),radial-gradient(40% 70% at 92% 20%,var(--glow3),transparent 70%)}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding-block:40px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px;margin-bottom:20px}
h1{font:600 clamp(28px,4vw,40px)/1.1 var(--font-display);margin:0 0 8px;letter-spacing:-.02em;text-wrap:balance}
h2{font:500 18px/1.3 var(--font-display);margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:13px}
header .sub{font-size:15px}
.demo{background:#fab219;color:#0b0b0b;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:600}
.warn{box-shadow:var(--ring);background:var(--surface);border-radius:10px;padding:10px 14px;margin-bottom:16px;color:var(--ink2)}
.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 0;margin-bottom:8px;border-bottom:1px dashed var(--axis)}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:12px;background:var(--card);box-shadow:var(--ring)}
.seg button{border:0;background:none;color:var(--ink2);padding:6px 12px;font:inherit;font-size:14px;border-radius:9px;cursor:pointer;transition:background .22s cubic-bezier(.175,.885,.32,1.1),color .22s}
.seg button+button{border-left:0}
.seg button:hover{color:var(--ink);background:var(--surface)}
.seg button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:0;box-shadow:var(--ring);border-radius:9px;padding:7px 10px;cursor:pointer}
label.f{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}
label.chk{color:var(--ink2);font-size:14px;display:flex;align-items:center;gap:8px;cursor:pointer}
label.chk input{accent-color:var(--accent);width:16px;height:16px;margin:0}
#filterNote{margin:6px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.tile{background:var(--card);box-shadow:var(--ring);border-radius:16px;padding:16px 18px}
.tile .k{color:var(--ink2);font-size:13px}
.tile .v{font:600 30px/1.15 var(--font-display);margin-top:4px;letter-spacing:-.02em}
.tile .d{font-size:12px;color:var(--muted);margin-top:4px}
.tile .d.up{color:var(--up)} .tile .d.down{color:var(--down)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.card{background:var(--card);box-shadow:var(--ring);border-radius:20px;padding:20px;margin-bottom:12px;min-width:0}
.card .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chart{position:relative;height:300px}
.chart.tall{height:340px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:right;padding:10px 8px;border-bottom:1px dashed var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px;border-bottom:1px solid var(--grid)}
tfoot td{border-bottom:0}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tbody tr{transition:background .22s}
tbody tr:hover{background:var(--wash)}
.scroll{overflow-x:auto}
.who{display:flex;flex-direction:column}
.who a{color:var(--ink);text-decoration:none;font-weight:600}
.who a:hover{text-decoration:underline}
.who small{color:var(--muted);font-size:11px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:baseline}
.rank{color:var(--muted);width:28px}
footer{color:var(--muted);font-size:12px;margin-top:28px;padding-top:16px;border-top:1px dashed var(--axis);line-height:1.7}
footer a{color:var(--ink2)}
footer code{font-size:11px}
.empty{padding:40px;text-align:center;color:var(--ink2)}
.search{width:100%;max-width:340px;font:inherit;font-size:14px;padding:8px 14px;border:0;box-shadow:var(--ring);border-radius:10px;background:var(--surface);color:var(--ink)}
.search::placeholder{color:var(--muted)}
.search:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:var(--ink);font-weight:600;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--accent)}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.ext{color:var(--muted);text-decoration:none;margin-left:6px;font-size:12px}
.ext:hover{color:var(--accent)}
dialog#user{border:0;box-shadow:var(--ring),0 24px 60px rgba(0,0,0,.18);border-radius:20px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog#user::backdrop{background:rgba(20,21,24,.4);backdrop-filter:blur(3px)}
.ub{padding:24px;position:relative}
.uhead{display:flex;gap:14px;align-items:center;padding-right:40px;flex-wrap:wrap}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;background:var(--wash);display:flex;align-items:center;justify-content:center;font:600 24px var(--font-display);color:var(--accent);flex:none}
.uname{font:600 20px/1.2 var(--font-display);letter-spacing:-.01em}
.chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;background:var(--wash);color:var(--ink2);margin-left:8px;vertical-align:middle;font-family:var(--font-body)}
.bio{color:var(--ink2);font-size:14px;margin:12px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.ub h3{font:500 14px var(--font-display);margin:20px 0 8px;color:var(--ink2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}
.stat{background:var(--card);box-shadow:var(--ring);border-radius:12px;padding:10px 12px}
.stat b{display:block;font:600 18px var(--font-display);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.bars{display:grid;gap:6px}
.bars .row{display:grid;grid-template-columns:150px 1fr 60px;gap:8px;align-items:center;font-size:12px}
.bars .row span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bars .track{height:8px;border-radius:4px;background:var(--grid)}
.bars .fill{height:8px;border-radius:4px}
.close{position:absolute;top:16px;right:16px;width:34px;height:34px;border-radius:50%;border:0;box-shadow:var(--ring);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer;line-height:1}
.close:hover{background:var(--wash)}
.ulinks{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin-top:8px}
.ulinks a{color:var(--ink);text-decoration:none;background:var(--surface);box-shadow:var(--ring);border-radius:8px;padding:4px 10px}
.ulinks a:hover{box-shadow:0 0 0 1px var(--accent)}
.muted{color:var(--muted)}
.sortbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;white-space:nowrap}
.sortbtn:hover,.sortbtn.on{color:var(--ink)}
.sortbtn.on{font-weight:600}
tfoot .sortbtn{padding:3px 9px;border-radius:7px;box-shadow:var(--ring);background:var(--surface);margin-left:2px}
tfoot .sortbtn.on{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.sortbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.nav{display:inline-flex;gap:4px;padding:3px;border-radius:12px;background:var(--card);box-shadow:var(--ring);margin-bottom:14px}
.nav a{color:var(--ink2);text-decoration:none;font-size:14px;padding:6px 14px;border-radius:9px}
.nav a:hover{color:var(--ink);background:var(--surface)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.topbar .nav{margin-bottom:0}
.theme{position:relative;display:inline-flex;align-items:center;gap:10px;color:var(--ink2);font-size:13px;cursor:pointer;user-select:none}
.theme input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.theme .sw{position:relative;width:44px;height:24px;border-radius:99px;background:var(--card);box-shadow:var(--ring);transition:background .22s}
.theme .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .22s cubic-bezier(.175,.885,.32,1.1)}
.theme input:checked+.sw{background:var(--accent)}
.theme input:checked+.sw::after{transform:translateX(20px)}
.theme input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.ghead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.gicon{width:56px;height:56px;border-radius:14px;object-fit:cover;background:var(--wash);display:flex;align-items:center;justify-content:center;font:600 22px var(--font-display);color:var(--accent);flex:none}
.gicon.sm{width:22px;height:22px;border-radius:6px;font-size:11px;display:inline-flex;vertical-align:middle;margin-right:8px}
.gdesc{color:var(--ink2);font-size:14px;margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;max-width:760px}
.gcell{display:inline-flex;align-items:center}
.clear{border:0;background:var(--surface);box-shadow:var(--ring);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.clear:hover{box-shadow:0 0 0 1px var(--accent)}
.posts{display:grid;gap:8px}
.post{background:var(--surface);box-shadow:var(--ring);border-radius:12px;padding:10px 12px;font-size:13px}
.post .meta{color:var(--muted);font-size:11px;margin-bottom:4px}
.post .txt{overflow-wrap:anywhere;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#tiles{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
  <nav class="nav" aria-label="Pages"><a href="./">Overview</a><a href="groups.html" aria-current="page">Groups</a></nav><label class="theme"><span>Dark mode</span><input type="checkbox" id="themeToggle" role="switch"><span class="sw" aria-hidden="true"></span></label></div>
  <header>
    <div>
      <h1>Lens groups activity</h1>
      <div class="sub" id="meta">Loading…</div>
    </div>
  </header>

  <div class="filters" role="toolbar" aria-label="Filters">
    <label class="f">Period
      <span class="seg" id="range">
        <button data-v="1">1 day</button><button data-v="7">7 days</button><button data-v="30">30 days</button><button data-v="90">90 days</button>
      </span>
    </label>
    <label class="f">Group
      <select id="group"></select>
    </label>
    <label class="f">Type
      <select id="kind">
        <option value="all">All content</option>
        <option value="post">Post</option>
        <option value="comment">Comment</option>
        <option value="quote">Quote</option>
        <option value="repost">Repost</option>
      </select>
    </label>
    <label class="chk"><input type="checkbox" id="hideSpam"> Hide spam</label>
    <label class="f">Min. account score
      <select id="minScore">
        <option value="0">Any</option>
        <option value="1">1+ (hide unscored)</option>
        <option value="5000">5,000+ (likely genuine)</option>
        <option value="9000">9,000+ (established)</option>
      </select>
    </label>
  </div>

  <div class="card" id="groupCard" hidden></div>

  <section class="tiles" id="tiles"></section>

  <div class="card">
    <div class="head"><div><h2 id="mainTitle">Daily content by group</h2><div class="sub" id="mainSub"></div></div></div>
    <div class="legend" id="mainLegend"></div>
    <div class="chart tall"><canvas id="cMain"></canvas></div>
  </div>

  <div class="grid2">
    <div class="card">
      <div class="head"><div><h2>Daily active posters</h2><div class="sub" id="activeSub"></div></div></div>
      <div class="chart"><canvas id="cActive"></canvas></div>
    </div>
    <div class="card">
      <div class="head"><div><h2>Clients used</h2><div class="sub" id="clientsSub"></div></div></div>
      <div class="bars" id="clients"></div>
    </div>
  </div>

  <div class="card">
    <div class="head">
      <div><h2>Groups</h2><div class="sub" id="groupsSub"></div></div>
      <input id="groupSearch" class="search" type="search" placeholder="Search groups" aria-label="Search groups" autocomplete="off">
    </div>
    <div class="scroll"><table id="groups"></table></div>
  </div>

  <div class="card">
    <div class="head">
      <div><h2>Most active accounts in groups</h2><div class="sub" id="topSub"></div></div>
      <input id="userSearch" class="search" type="search" placeholder="Search by username or address" aria-label="Search accounts" autocomplete="off">
    </div>
    <div class="scroll"><table id="top"></table></div>
  </div>

  <footer id="foot"></footer>
</div>

<dialog id="user" aria-label="Account details"><div class="ub" id="userBody"></div></dialog>

<script>
const BASE = /github\.io$/.test(location.hostname) || location.protocol === "file:" ? "" : "https://dankshardeth.github.io/lens-dashboard/";
const API = "https://api.lens.xyz/graphql";
const KINDS = ["post","comment","quote","repost"];
const KIND_LABEL = {post:"Posts", comment:"Comments", quote:"Quotes", repost:"Reposts", all:"All content"};
const TOP_GROUPS = 7;
const fmt = n => n == null ? "–" : n.toLocaleString("en-US");
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const gql = async (query, variables) => (await (await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ query, variables }) })).json()).data;

let G, MAIN = null, C, charts = {};
const state = { range: 30, group: "all", kind: "all", hideSpam: true, minScore: 5000 };
try { const s = JSON.parse(localStorage.getItem("lensdash") || "{}"); for (const k of ["range", "hideSpam", "minScore"]) if (k in s) state[k] = s[k]; } catch (e) {}
try { Object.assign(state, JSON.parse(localStorage.getItem("lensgroups") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("lensgroups", JSON.stringify(state)); } catch (e) {} };

const gName = g => g ? (g[1] || g[0].slice(0, 6) + "…" + g[0].slice(-4)) : "?";
const uName = u => u[1] ? "@" + u[1] : u[0].slice(0, 6) + "…" + u[0].slice(-4);
const periodText = r => r === 1 ? "yesterday" : `the last ${r} full days`;
const prevText = r => r === 1 ? "vs. the day before" : `vs. previous ${r} days`;
function win(range, back = 0) { const hi = G.days.length - 1 - back * range; return [hi - range, hi]; }
const sum = (arr, [lo, hi]) => lo < 0 ? null : arr.slice(lo, hi).reduce((a, b) => a + b, 0);
function visibleIdx() { const n = G.days.length; return [Math.max(0, n - 1 - Math.max(state.range, 7)), n]; }
const cut = arr => arr.slice(...visibleIdx());
const isToday = i => visibleIdx()[0] + i === G.days.length - 1;
const labels = () => cut(G.days.map((_, i) => i));
const selIdx = () => state.group === "all" ? -1 : G.groups.findIndex(g => g[0] === state.group);
const iconHtml = (g, cls = "gicon sm") => g && g[2] && /^https:\/\//.test(g[2]) ? `<img class="${cls}" src="${esc(g[2])}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">` : `<span class="${cls}">${esc(gName(g)[0].toUpperCase())}</span>`;

function delta(cur, prev) {
  if (prev == null || cur == null) return `<div class="d">–</div>`;
  if (prev === 0) return `<div class="d">previous period: 0</div>`;
  const p = (cur - prev) / prev * 100;
  const cls = p > 0.5 ? "up" : p < -0.5 ? "down" : "";
  const arrow = p > 0.5 ? "▲" : p < -0.5 ? "▼" : "■";
  return `<div class="d ${cls}">${arrow} ${Math.abs(p).toFixed(1)}% <span style="color:var(--muted)">${prevText(state.range)}</span></div>`;
}

// One pass over groups.json with the current filters.
function compute() {
  const N = G.days.length, [lo, hi] = win(state.range), [plo, phi] = win(state.range, 1), sel = selIdx();
  const kSel = state.kind === "all" ? -1 : KINDS.indexOf(state.kind);
  const daily = KINDS.map(() => Array(N).fill(0)), activeDay = Array.from({ length: N }, () => new Set());
  const byGroupDay = {}, groups = {}, accounts = {}, clients = {}, activeWin = new Set();
  const e = G.e;
  for (let i = 0; i < e.length; i += 6) {
    const d = e[i], g = e[i + 1], a = e[i + 2], u = e[i + 3], k = e[i + 4], n = e[i + 5];
    if (state.hideSpam && (G.apps[a][2] || G.groups[g][5])) continue;
    const sc = G.accounts[u][2]; if (sc != null && sc < state.minScore) continue;
    const inWin = d >= lo && d < hi;
    if (inWin || (d >= plo && d < phi)) {
      const x = (groups[g] ||= { tot: 0, prev: 0, c: [0, 0, 0, 0], active: new Set(), apps: {} });
      if (inWin) { x.tot += n; x.c[k] += n; x.active.add(u); x.apps[a] = (x.apps[a] || 0) + n; } else x.prev += n;
    }
    if (sel >= 0 && g !== sel) continue;
    daily[k][d] += n; activeDay[d].add(u);
    if (kSel < 0 || k === kSel) (byGroupDay[g] ||= Array(N).fill(0))[d] += n;
    if (inWin) {
      activeWin.add(u); clients[a] = (clients[a] || 0) + n;
      const y = (accounts[u] ||= { c: [0, 0, 0, 0], groups: {} });
      y.c[k] += n; y.groups[g] = (y.groups[g] || 0) + n;
    }
  }
  return { daily, active: activeDay.map(s => s.size), byGroupDay, groups, accounts, clients, activeWin: activeWin.size, sel };
}

function renderTiles() {
  const w = win(state.range), pw = win(state.range, 1);
  const all = C.daily[0].map((_, i) => C.daily.reduce((s, a) => s + a[i], 0));
  const tile = (label, cur, prev, note) => `<div class="tile"><div class="k">${label}</div><div class="v">${cur}</div>${note != null ? `<div class="d">${note}</div>` : delta(prev[0], prev[1])}</div>`;
  const tot = sum(all, w);
  let html = tile("All content", fmt(tot), [tot, sum(all, pw)]);
  KINDS.forEach((k, i) => { const c = sum(C.daily[i], w); html += tile(KIND_LABEL[k], fmt(c), [c, sum(C.daily[i], pw)]); });
  html += tile("Active posters", fmt(C.activeWin), null, r1("unique accounts"));
  if (C.sel < 0) html += tile("Active groups", fmt(Object.values(C.groups).filter(x => x.tot > 0).length), null, r1("groups with content"));
  else { const g = G.groups[C.sel]; html += tile("Members", fmt(g[3]), null, memberChange(g)); }
  const lensAll = mainTotal(w);
  if (lensAll) html += tile("Share of all Lens content", (tot / lensAll * 100).toFixed(1) + "%", null, C.sel < 0 ? "published inside groups" : "published in this group");
  document.getElementById("tiles").innerHTML = html;
}
const r1 = what => state.range === 1 ? `${what} yesterday` : `${what} in ${state.range} days`;
function memberChange(g) {
  if (g[3] == null) return "member count unavailable";
  if (g[4] == null) return "weekly change: collecting";
  const d = g[3] - g[4];
  return `<span style="color:var(${d > 0 ? "--up" : d < 0 ? "--down" : "--muted"})">${d > 0 ? "+" : d < 0 ? "−" : "±"}${fmt(Math.abs(d))}</span> in 7 days`;

// total content on Lens (same filters) from the overview data, for the share tile
function mainTotal(w) {
  const v = MAIN && MAIN.variants && MAIN.variants[(state.hideSpam ? "n" : "s") + state.minScore];
  if (!v) return null;

function baseOptions(stacked) {

        itemSort: (a, b) => b.raw - a.raw,

      if (a.metadata?.name) document.getElementById("uDisplay").textContent = a.metadata.name;
      if (typeof a.score === "number") document.getElementById("uScore").textContent = "score " + fmt(a.score);
      document.getElementById("uBio").textContent = a.metadata?.bio || "";
      const pic = a.metadata?.picture;
      if (pic && /^https:\/\//.test(pic)) { const img = document.createElement("img"); img.className = "avatar"; img.alt = ""; img.src = pic; const av = document.getElementById("uAvatar"); if (av) av.replaceWith(img); }
    }
    const f = st?.graphFollowStats || {}, fs = st?.feedStats || {};
    document.getElementById("uLive").innerHTML = stat(fmt(f.followers), "Followers") + stat(fmt(f.following), "Following") + stat(fmt(fs.posts), "Posts") + stat(fmt(fs.comments), "Comments") + stat(fmt(fs.reactions), "Likes received") + stat(fmt(fs.reacted), "Likes given") + stat(a?.createdAt ? a.createdAt.slice(0, 10) : "–", "Account created");
  } catch (e) {
    const el = document.getElementById("uLive"); if (el) el.innerHTML = `<div class="muted" style="font-size:12px">Live profile data could not be loaded from the Lens API.</div>`;
  }
}

// ---------------------------------------------------------------- wiring
function fillGroupSelect() {
  const sel = document.getElementById("group");
  const list = G.groups.map((g, i) => [g, i]).filter(([g]) => !(state.hideSpam && g[5])).slice(0, 150);
  if (state.group !== "all" && !list.some(([g]) => g[0] === state.group)) { const i = selIdx(); if (i >= 0) list.push([G.groups[i], i]); }
  sel.innerHTML = `<option value="all">All groups</option>` + list.map(([g]) => `<option value="${esc(g[0])}">${esc(gName(g))}</option>`).join("");
  sel.value = state.group;
}
function setGroup(g) {
  state.group = g; save(); renderAll();
  window.scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
function renderAll() {
  if (selIdx() < 0) state.group = "all";
  fillGroupSelect();
  document.getElementById("hideSpam").checked = state.hideSpam;
  document.getElementById("minScore").value = String(state.minScore);
  document.getElementById("kind").value = state.kind;
  document.querySelectorAll("#range button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === state.range)));
  C = compute();
  renderTiles(); renderCharts(); renderClients(); renderGroups(); renderTop(); renderGroupCard();
}

async function init() {
  // dark mode switch: follows the system until the visitor picks one, then remembers it
  const root = document.documentElement, tt = document.getElementById("themeToggle");
  const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const redraw = () => { try { renderAll(); } catch (e) {} };
  tt.checked = isDark();
  tt.onchange = () => { root.dataset.theme = tt.checked ? "dark" : "light"; try { localStorage.setItem("lenstheme", root.dataset.theme); } catch (e) {} redraw(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { tt.checked = isDark(); redraw(); });
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  try {
    G = await (await fetch(BASE + "groups.json", { cache: "no-store" })).json();
    if (G.v !== 1) throw new Error("format");
  } catch (e) {
    document.getElementById("meta").textContent = "Group data is not available yet. It is created by the next data update.";
    return;
  }
  try { MAIN = await (await fetch(BASE + "data.json", { cache: "no-store" })).json(); G.timezone = MAIN.timezone; } catch (e) {}
  if (![1, 7, 30, 90].includes(state.range)) state.range = 30;
  if (![0, 1, 5000, 9000].includes(+state.minScore)) state.minScore = 5000;
  state.minScore = +state.minScore;
  const qs = new URLSearchParams(location.search).get("group");
  if (qs) state.group = qs.toLowerCase();
  document.getElementById("meta").innerHTML = (MAIN ? `Updated: ${new Date(MAIN.generated_at).toLocaleString("en-US")} · ` : "") + `content published inside Lens groups · source: Lens API, live`;

  document.getElementById("group").onchange = e => setGroup(e.target.value);
  document.getElementById("hideSpam").onchange = e => { state.hideSpam = e.target.checked; save(); renderAll(); };
  document.getElementById("minScore").onchange = e => { state.minScore = +e.target.value; save(); renderAll(); };
  document.getElementById("kind").onchange = e => { state.kind = e.target.value; save(); renderAll(); };
  document.querySelectorAll("#range button").forEach(btn => btn.onclick = () => { state.range = +btn.dataset.v; save(); renderAll(); });
  document.getElementById("groupSearch").oninput = renderGroups;
  document.getElementById("userSearch").oninput = renderTop;
  const toggle = (t, key, textCols) => { if (t.sort === key) t.dir *= -1; else { t.sort = key; t.dir = textCols.includes(key) ? 1 : -1; } };
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-addr],[data-group],[data-gsort],[data-glimit],[data-asort],[data-alimit]"); if (!el) return;
    const ds = el.dataset;
    if (ds.addr) { e.preventDefault(); openUser(ds.addr); }
    else if (ds.group) { document.getElementById("user").close(); setGroup(ds.group); }
    else if (ds.gsort) { toggle(gTable, ds.gsort, ["group", "client"]); renderGroups(); }
    else if (ds.glimit) { gTable.limit = +ds.glimit; renderGroups(); }
    else if (ds.asort) { toggle(aTable, ds.asort, ["account", "main"]); renderTop(); }
    else if (ds.alimit) { aTable.limit = +ds.alimit; renderTop(); }
  });
  document.getElementById("user").addEventListener("click", e => { if (e.target.id === "user") e.target.close(); });

  document.getElementById("foot").innerHTML = `
    <b>Source:</b> the public <a href="https://lens.xyz/docs/protocol" style="color:inherit">Lens API</a> (api.lens.xyz), collected every few hours.
    A post belongs to a group when it was published in the group's feed. Comments and quotes count in the group of the post they reply to or quote; reposts count in the group of the reposted post.
    Members = current member count from the Lens API, recorded once a day; the 7-day change appears after a week of records.
    Summary figures and tables cover full days only ("1 day" = yesterday); today appears on the charts only.
    "Hide spam" removes content from apps flagged as automated spam and from groups flagged as spam. "Min. account score" uses the Lens account score (1–10,000); see the <a href="./" style="color:inherit">overview</a> for details.`;

  renderAll();
}
init();
</script>
